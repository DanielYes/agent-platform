# CI para proyectos Python: ruff, pytest con cobertura y build.
#
# Uso desde un proyecto:
#   jobs:
#     ci:
#       uses: DanielYes/agent-platform/.github/workflows/ci-python.yml@v0.1.0
#       with:
#         python-version: "3.12"
#         coverage-min: 80
name: ci-python

on:
  workflow_call:
    inputs:
      python-version:
        description: Versión de Python.
        type: string
        default: "3.12"
      coverage-min:
        description: Cobertura mínima en porcentaje; por debajo, el job falla.
        type: number
        default: 80

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install ruff pytest pytest-cov build
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Lint (ruff)
        run: |
          ruff check --output-format=github .

      - name: Tests con cobertura (pytest)
        env:
          COVERAGE_MIN: ${{ inputs.coverage-min }}
        run: pytest --cov --cov-report=term-missing --cov-report=xml --cov-fail-under="$COVERAGE_MIN"

      - name: Build
        run: |
          if [ -f pyproject.toml ]; then
            python -m build
          else
            echo "No hay pyproject.toml: se omite el build."
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-${{ inputs.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
